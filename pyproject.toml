[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-diff-ini-files"
dynamic = ["version"]
description = "Compare two INI files by section, key, and value."
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.10"
authors = [{ name = "The Lupaxa Project" }]
keywords = ["ini", "diff", "config", "cli"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lupaxa-developers-toolbox/diff-ini-files"
Repository = "https://github.com/lupaxa-developers-toolbox/diff-ini-files"
Issues = "https://github.com/lupaxa-developers-toolbox/diff-ini-files/issues"

[project.scripts]
diff-ini-files = "lupaxa.diff_ini_files.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "hatch>=1.12.0",
  "bump-my-version>=1.2.0",
  "pip-audit>=2.7.0",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.version]
path = "src/lupaxa/diff_ini_files/version.py"

[tool.hatch.build.targets.sdist]
include = ["src/**", "README.md", "LICENCE"]

[tool.hatch.build.targets.wheel]
packages = ["src/lupaxa"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Core Lupaxa rule set
select = [
  # --- Essential correctness + hygiene ---
  "E",    # pycodestyle: basic style errors
  "F",    # pyflakes: unused vars, undefined names
  "I",    # import sorting
  "B",    # bugbear: common footguns

  # --- Security layer ---
  "S",    # bandit-like security checks

  # --- Modernisation + cleanup ---
  "UP",   # pyupgrade: modern Python idioms
  "SIM",  # simplify complex expressions/conditions
  "C4",   # flake8-comprehensions
  "ISC",  # implicit string-concat safety

  # --- New additions (strict mode) ---
  "D",    # pydocstyle: docstring formatting/consistency
  "ANN",  # annotations: missing/incorrect typing hints
  "PT",   # pytest: best practices for tests
]

# Disable D2xx summary/spacing rules that conflict with our preferred style
ignore = [
  "D200", # one-line docstring violation (not needed for multi-line)
  "D201", # no blank line before docstring
  "D202", # blank line after docstring
  "D203", # 1 blank line before class docstring
  "D204", # 1 blank line after class docstring
  "D205", # 1 blank line required between summary line and description
  "D206", # various indentation rules
  "D207",
  "D208",
  "D209",
  "D210",
  "D211",
  "D212", # "Summary should start at first line" (we prefer second line)
]

[tool.ruff.lint.per-file-ignores]
# Nested test layout (tests/cli, tests/core); `tests/*` alone does not match.
"tests/**/*.py" = [
  "S101",   # allow bare assert in tests
  "S105",   # allow test-only "password"-like literals
  "ANN001", # allow untyped fixture arguments
  "ANN201", # allow untyped test function returns
]

[tool.ruff.lint.pydocstyle]
# NumPy-style docstrings, closest to our format
convention = "numpy"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]
